<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson planner</title>
<link rel="icon" href="favicon.svg?v=14" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
<header>
  <div class="weeknav">
    <button id="prev" title="Previous week">&larr;</button>
    <div class="wk"><span class="sizer" id="wksizer"></span><span id="wklabel"></span></div>
    <button id="next" title="Next week">&rarr;</button>
  </div>
  <nav>
    <button id="smaller" title="Smaller text">A&darr;</button>
    <button id="bigger" title="Larger text">A&uarr;</button>
    <button id="tight" aria-pressed="false" title="Line spacing"></button>
    <button id="colour">Colour: tinted</button>
    <span class="sep"></span>
    <button id="tview">By class</button>
    <button id="tstu">Student view</button>
    <span class="sep"></span>
    <button id="sync" title="Click to sync now, shift-click to set the URL and token">Not connected</button>
    <button id="publish" title="Send this week to the student pages">Publish</button>
  </nav>
  <h1>Lesson planner</h1>
  <div class="classbar" id="classbar"><b>Classes</b></div>
</header>

<main id="app"></main>

<div id="pop"></div>

<div id="bar"><b></b><span></span></div>

<script src="data.js?v=14"></script>
<script src="render.js?v=14"></script>
<script src="editor.js?v=14"></script>
<script src="sync.js?v=14"></script>
<script>start();</script>
</body>
</html>
